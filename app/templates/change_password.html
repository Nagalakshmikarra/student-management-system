{% extends "base_public.html" %}
{% block content %}
<div class="card-sms p-5 mx-auto" style="max-width:480px">
  <h4 class="fw-bold">Change your password</h4>
  <p class="text-muted">Choose a new password (at least 8 characters).</p>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <form method="post" action="/change-password">
    <div class="mb-3"><label class="form-label">New password</label>
      <input type="password" name="new_password" class="form-control" minlength="8" required></div>
    <div class="mb-3"><label class="form-label">Confirm new password</label>
      <input type="password" name="confirm_password" class="form-control" minlength="8" required></div>
    <button class="btn btn-navy w-100">Save password</button>
  </form>
</div>
{% endblock %}
