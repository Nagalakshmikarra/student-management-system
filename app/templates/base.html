<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title or app_name }} - {{ app_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <aside class="sidebar p-3">
    <h4 class="mb-4">SMS <small class="d-block fs-6 text-white-50">College Portal</small></h4>
    <ul class="nav flex-column">
      {% for item in menu or [] %}
      <li class="nav-item">
        <a class="nav-link {% if request.url.path == item.url %}active{% endif %}" href="{{ item.url }}">{{ item.label }}</a>
      </li>
      {% endfor %}
    </ul>
  </aside>
  <div class="flex-grow-1">
    <div class="topbar d-flex justify-content-between align-items-center px-4 py-3">
      <h5 class="mb-0">{{ page_title }}</h5>
      <div class="d-flex align-items-center gap-3">
        <span>{{ user.full_name }}</span>
        <span class="role-badge">{{ user.role.value }}</span>
        <a href="/logout" class="text-danger text-decoration-none fw-semibold">Logout</a>
      </div>
    </div>
    <main class="p-4">{% block content %}{% endblock %}</main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
